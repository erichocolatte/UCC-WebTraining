services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    # ports:
    #   - "3306:3306"
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    # restart: always
  
  miniecom:
    image: mini-ecom
    build: .
    container_name: miniecom
    # restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    env_file:
      - .env
    # volumes:
    #   - miniecom_data:/app

  redis:
    image: redis:7
    container_name: redis
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    # restart: always

  nginx:
    image: nginx:latest
    container_name: nginx
    # restart: always
    ports:
      - "80:80"
    depends_on:
      - miniecom
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./front-end:/usr/share/nginx/html/front-end
      - ./public:/usr/share/nginx/html/public

volumes:
  mysql_data:
  # miniecom_data:
  redis_data:
