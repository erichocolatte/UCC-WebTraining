<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="card auth-card">
            <div class="card-header">
                <h2>
                    <a href="/front-end/index.html">MiniEcom</a>
                </h2>
            </div>
            <div class="card-body">
                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" id="login">Login</button>
                </form>
                <div class="form-footer">
                    Don't have an account? <a href="register.html" style="color: var(--secondary-background); font-weight: 600;">Sign up</a>
                </div>
            </div>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="login.js"></script>    
</body>
</html>
