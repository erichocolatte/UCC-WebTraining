<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart - MiniEcom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

    <div class="container">
        <header class="cart-header-section">
            <h2>Your Cart</h2>
            <a href="/front-end/index.html" class="btn btn-outline">Back to Home</a>
        </header>

        <div id="cart-content">
            <!-- Cart items will be loaded here -->
            <div class="cart-layout">
                <div class="cart-table-card">
                    <table class="cart-table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Total</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="cart-items">
                            <!-- Items dynamically added -->
                        </tbody>
                    </table>
                </div>

                <div class="cart-summary">
                    <h2 class="summary-title">Order Summary</h2>
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Shipping</span>
                        <span>Free</span>
                    </div>
                    <div class="summary-total">
                        <span>Total</span>
                        <span id="total-price">$0.00</span>
                    </div>
                    <button id="checkout-btn" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">Proceed to Checkout</button>
                    <a href="index.html" class="btn btn-outline btn-block" style="margin-top: 0.75rem;">Continue Shopping</a>
                </div>
            </div>
        </div>
        
        <div id="empty-cart-msg" class="cart-empty" style="display: none;">
            <h3>Your cart is empty</h3>
            <p>Looks like you haven't added anything to your cart yet.</p>
            <a href="index.html" class="btn btn-primary" style="margin-top: 1.5rem;">Start Shopping</a>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="cart.js"></script>
</body>
</html>
