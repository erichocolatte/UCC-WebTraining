<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MiniEcom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: none;">

    <div class="auth-container">
        <div class="card auth-card">
            <div class="card-header">
                <h2>
                    <a href="/front-end/index.html">MiniEcom</a>
                </h2>
            </div>
            <div class="card-body">
                <form id="register-form">
                    <div class="form-group">
                        <label for="name">Your username</label>
                        <input type="text" id="name" name="name" placeholder="username" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="" required>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="" disabled selected>Select your gender</option>
                            <option value="MALE">Male</option>
                            <option value="FEMALE">Female</option>
                            <!-- <option value="OTHER">Other</option> -->
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" id="register">Create account</button>
                </form>
                <div class="form-footer">
                    Already have an account? <a href="login.html" style="color: var(--secondary-background); font-weight: 600;">Sign in</a>
                </div>
            </div>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="register.js"></script>
</body>
</html>
