<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - MiniEcom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container navbar-content">
            <a href="index.html" class="brand">MiniEcom</a>
            <div class="nav-menu">
                <a href="index.html" class="nav-item">Products</a>
                <a href="cart.html" class="nav-item">Cart</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="product-detail">
            <div class="detail-img">
                <img id="mainImage" src="https://via.placeholder.com/600x400" alt="Product Image">
            </div>
            <div class="detail-info">
                <h1 class="detail-title" id="productName">Loading...</h1>
                <div class="detail-price" id="productPrice"></div>
                <p class="detail-desc" id="productDescription"></p>
                
                <div style="margin-bottom: 20px;">
                    <label for="quantity">Quantity:</label>
                    <input type="number" id="quantity" value="1" min="1" max="100" style="padding: 5px; width: 60px;">
                </div>

                <div style="margin-bottom: 20px;" id="thumbnailContainer">
                   <!-- Thumbnails -->
                </div>

                <button id="addToCartBtn" class="btn btn-primary btn-block">Add to Cart</button>
            </div>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="product.js"></script>
</body>
</html>
