<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - MiniEcom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container navbar-content">
            <a href="index.html" class="brand">MiniEcom</a>
            <div class="nav-menu">
                <a href="index.html" class="nav-item">Products</a>
                <a href="cart.html" class="nav-item active" style="color: var(--accent);">Cart</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 style="margin: 30px 0;">Shopping Cart</h2>
        
        <table class="table" id="cartTable">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="cartBody">
                <!-- Cart items -->
            </tbody>
        </table>

        <div style="text-align: right; margin-top: 20px;">
            <h3>Total: <span id="cartTotal">$0.00</span></h3>
            <button id="checkoutBtn" class="btn btn-primary" style="margin-top: 10px;">Checkout</button>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="cart.js"></script>
</body>
</html>
